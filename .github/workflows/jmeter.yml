name: JMeter Performance Test

on:
  push:
    branches:
      - main

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run JMeter test
        run: |
          mkdir -p results
          apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t Bookstore.jmx \
            -l results/result.jtl \
            -Jjmeter.save.saveservice.output_format=csv

      - name: Check JMeter failures
        run: |
          python - <<'PY'
          import csv
          import sys

          path = "results/result.jtl"

          with open(path, newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              failures = [
                  row for row in reader
                  if row.get("success", "").lower() == "false"
              ]

          print(f"Failed samples: {len(failures)}")

          if failures:
              print("JMeter test failed because one or more samples failed.")
              sys.exit(1)

          print("All JMeter samples passed.")
          PY

      - name: Generate HTML Dashboard
        if: always()
        run: |
          rm -rf results/html-report
          apache-jmeter-5.6.3/bin/jmeter \
            -g results/result.jtl \
            -o results/html-report

      - name: Upload JMeter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: results/html-report

      - name: Upload JTL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/result.jtl